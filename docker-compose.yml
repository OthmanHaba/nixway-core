services:
  traefik:
    image: traefik:v3
    profiles:
      - traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--log.level=${NIXWAY_TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=${NIXWAY_TRAEFIK_ACCESS_LOG:-false}"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addrouterslabels=true"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${NIXWAY_TRAEFIK_ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "${NIXWAY_HTTP_PORT:-80}:80"
      - "${NIXWAY_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      # public for routing; internal so Alloy can scrape the :8082 metrics
      # endpoint. Per-service routing still uses traefik.docker.network labels.
      - public
      - internal

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${NIXWAY_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${NIXWAY_POSTGRES_DB:-nixway_core}
      POSTGRES_USER: ${NIXWAY_POSTGRES_USER:-nixway}
      POSTGRES_PASSWORD: ${NIXWAY_POSTGRES_PASSWORD:-nixway-dev-secret-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 1

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${NIXWAY_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      NIXWAY_DATABASE_URL: ${NIXWAY_DATABASE_URL:-postgres://nixway:nixway-dev-secret-change-me@postgres:5432/nixway_core?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "${NIXWAY_API_PORT:-8080}:8080"
      - "${NIXWAY_GRPC_PORT:-9090}:${NIXWAY_GRPC_PORT:-9090}"
    environment:
      NIXWAY_DATABASE_URL: ${NIXWAY_DATABASE_URL:-postgres://nixway:nixway-dev-secret-change-me@postgres:5432/nixway_core?sslmode=disable}
      NIXWAY_REDIS_URL: ${NIXWAY_REDIS_URL:-redis://redis:6379/0}
      NIXWAY_SERVER_HOST: 0.0.0.0
      NIXWAY_SERVER_PORT: 8080
      NIXWAY_SERVER_GRPC_PORT: ${NIXWAY_GRPC_PORT:-9090}
      NIXWAY_SERVER_PUBLIC_URL: ${NIXWAY_SERVER_PUBLIC_URL:-http://localhost:8080}
      NIXWAY_SERVER_AGENT_GRPC_HOST: ${NIXWAY_SERVER_AGENT_GRPC_HOST:-}
      NIXWAY_SERVER_AGENT_BINARY_DIR: /app/agent/bin
      NIXWAY_CRYPTO_MASTER_KEY: ${NIXWAY_CRYPTO_MASTER_KEY:?NIXWAY_CRYPTO_MASTER_KEY is required. Run scripts/deploy to generate it.}
      NIXWAY_AUTH_BCRYPT_COST: ${NIXWAY_AUTH_BCRYPT_COST:-12}
      NIXWAY_AUTH_SESSION_TTL: ${NIXWAY_AUTH_SESSION_TTL:-24h}
      NIXWAY_EMAIL_DRIVER: ${NIXWAY_EMAIL_DRIVER:-console}
      NIXWAY_EMAIL_FROM: ${NIXWAY_EMAIL_FROM:-noreply@nixway.dev}
      NIXWAY_EMAIL_API_KEY: ${NIXWAY_EMAIL_API_KEY:-}
      NIXWAY_EMAIL_BASE_URL: ${NIXWAY_EMAIL_BASE_URL:-http://localhost:5173}
      NIXWAY_GITHUB_BASE_URL: ${NIXWAY_GITHUB_BASE_URL:-https://github.com}
      NIXWAY_GITHUB_API_URL: ${NIXWAY_GITHUB_API_URL:-https://api.github.com}
      NIXWAY_GITHUB_WEBHOOK_URL: ${NIXWAY_GITHUB_WEBHOOK_URL:-}
      NIXWAY_GITHUB_REDIRECT_URL: ${NIXWAY_GITHUB_REDIRECT_URL:-}
      NIXWAY_DOMAIN_BASE_DOMAIN: ${NIXWAY_DOMAIN_BASE_DOMAIN:-apps.nixway.dev}
      NIXWAY_OBSERVABILITY_VICTORIA_METRICS_URL: http://victoria-metrics:8428
      NIXWAY_OBSERVABILITY_VMAGENT_URL: http://vmagent:8429
      NIXWAY_OBSERVABILITY_VMAGENT_CONFIG_PATH: /etc/vmagent/prometheus.yml
      NIXWAY_PLATFORMSTORAGE_ENDPOINT: http://minio:9000
      NIXWAY_PLATFORMSTORAGE_BUCKET: ${NIXWAY_PLATFORMSTORAGE_BUCKET:-nixway-backups}
      NIXWAY_PLATFORMSTORAGE_REGION: ${NIXWAY_PLATFORMSTORAGE_REGION:-us-east-1}
      NIXWAY_PLATFORMSTORAGE_USESSL: ${NIXWAY_PLATFORMSTORAGE_USESSL:-false}
      NIXWAY_PLATFORMSTORAGE_PROVIDER: ${NIXWAY_PLATFORMSTORAGE_PROVIDER:-minio}
      NIXWAY_PLATFORMSTORAGE_ACCESSKEY: ${NIXWAY_PLATFORMSTORAGE_ACCESSKEY:-nixway}
      NIXWAY_PLATFORMSTORAGE_SECRETKEY: ${NIXWAY_PLATFORMSTORAGE_SECRETKEY:-nixway-dev-secret-change-me}
    volumes:
      - ./configs/vmagent.yml:/etc/vmagent/prometheus.yml:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      victoria-metrics:
        condition: service_started
      vmagent:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nixway-api.rule=Host(`${NIXWAY_PUBLIC_DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/agent`))"
      - "traefik.http.routers.nixway-api.entrypoints=websecure"
      - "traefik.http.routers.nixway-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nixway-api.priority=100"
      - "traefik.http.services.nixway-api.loadbalancer.server.port=8080"
      - "traefik.docker.network=${NIXWAY_DOCKER_PUBLIC_NETWORK:-nixway-public}"
    networks:
      - public
      - internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      NIXWAY_DATABASE_URL: ${NIXWAY_DATABASE_URL:-postgres://nixway:nixway-dev-secret-change-me@postgres:5432/nixway_core?sslmode=disable}
      NIXWAY_REDIS_URL: ${NIXWAY_REDIS_URL:-redis://redis:6379/0}
      NIXWAY_EMAIL_DRIVER: ${NIXWAY_EMAIL_DRIVER:-console}
      NIXWAY_EMAIL_FROM: ${NIXWAY_EMAIL_FROM:-noreply@nixway.dev}
      NIXWAY_EMAIL_API_KEY: ${NIXWAY_EMAIL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web-v2/Dockerfile
    ports:
      - "${NIXWAY_WEB_PORT:-5173}:80"
    environment:
      # The Next.js rewrites layer proxies /api/* to this URL — must point at
      # the internal api service on the docker network at boot.
      NIXWAY_API_URL: ${NIXWAY_API_URL:-http://api:8080}
      NODE_ENV: production
    depends_on:
      - api
    healthcheck:
      # /login is the public unauthenticated entry — guaranteed 200 when
      # the Next server is up.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/login"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nixway-web.rule=Host(`${NIXWAY_PUBLIC_DOMAIN:-localhost}`)"
      - "traefik.http.routers.nixway-web.entrypoints=websecure"
      - "traefik.http.routers.nixway-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nixway-web.priority=10"
      - "traefik.http.services.nixway-web.loadbalancer.server.port=80"
      - "traefik.docker.network=${NIXWAY_DOCKER_PUBLIC_NETWORK:-nixway-public}"
    networks:
      - public
      - internal

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    ports:
      - "${NIXWAY_SITE_PORT:-5373}:80"
    environment:
      # Marketing site is fully static at runtime — only NIXWAY_CONSOLE_URL
      # is consumed (server-rendered into "Sign in" / "Start free" links).
      NIXWAY_CONSOLE_URL: ${NIXWAY_CONSOLE_URL:-https://console.nixway.dev}
      NODE_ENV: production
    healthcheck:
      # /docs is public and exercises a dynamic route, so it's a useful probe.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/docs"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      # Marketing host (e.g. nixway.dev) routes here; the operator console
      # router (nixway-web above) keeps the platform host. They run side by
      # side behind one Traefik with a TLS cert per host.
      - "traefik.enable=true"
      - "traefik.http.routers.nixway-site.rule=Host(`${NIXWAY_MARKETING_DOMAIN:-localhost}`)"
      - "traefik.http.routers.nixway-site.entrypoints=websecure"
      - "traefik.http.routers.nixway-site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nixway-site.priority=10"
      - "traefik.http.services.nixway-site.loadbalancer.server.port=80"
      # Canonicalize www → apex so a CNAME like www.nixway.dev → nixway.dev
      # serves the site instead of hitting Traefik's default 404.
      - "traefik.http.routers.nixway-site-www.rule=Host(`www.${NIXWAY_MARKETING_DOMAIN:-localhost}`)"
      - "traefik.http.routers.nixway-site-www.entrypoints=websecure"
      - "traefik.http.routers.nixway-site-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nixway-site-www.priority=10"
      - "traefik.http.routers.nixway-site-www.service=nixway-site"
      - "traefik.http.routers.nixway-site-www.middlewares=nixway-www-to-apex"
      - "traefik.http.middlewares.nixway-www-to-apex.redirectregex.regex=^https?://www\\.(.+)"
      - "traefik.http.middlewares.nixway-www-to-apex.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.nixway-www-to-apex.redirectregex.permanent=true"
      - "traefik.docker.network=${NIXWAY_DOCKER_PUBLIC_NETWORK:-nixway-public}"
    networks:
      - public

  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    ports:
      - "8428:8428"
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=12"
      # NOTE: -downsampling.period is VictoriaMetrics Enterprise-only. The
      # open-source image rejects it and crash-loops on boot, so it's removed.
    volumes:
      - vmdata:/victoria-metrics-data
    networks:
      - internal

  vmagent:
    image: victoriametrics/vmagent:latest
    ports:
      - "8429:8429"
    command:
      - "-promscrape.config=/etc/vmagent/prometheus.yml"
      - "-promscrape.configCheckInterval=10s"
      - "-remoteWrite.url=http://victoria-metrics:8428/api/v1/write"
    volumes:
      - ./configs/vmagent.yml:/etc/vmagent/prometheus.yml:ro
    depends_on:
      - victoria-metrics
    networks:
      - internal

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${NIXWAY_MINIO_ROOT_USER:-nixway}
      MINIO_ROOT_PASSWORD: ${NIXWAY_MINIO_ROOT_PASSWORD:-nixway-dev-secret-change-me}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Control-plane observability (logs + telemetry) ──
  # Loki stores logs; Alloy ships container logs into it and scrapes metrics
  # into the existing VictoriaMetrics; Grafana visualises both. Exporters give
  # container/host/datastore telemetry. This is additive — the tenant vmagent
  # path is untouched.
  loki:
    image: grafana/loki:3.1.1
    profiles:
      - observability
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./configs/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    networks:
      - internal

  alloy:
    image: grafana/alloy:v1.4.2
    profiles:
      - observability
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./configs/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    depends_on:
      - loki
      - victoria-metrics
    networks:
      - internal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles:
      - observability
    restart: unless-stopped
    command:
      - "-housekeeping_interval=15s"
      - "-docker_only=true"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    networks:
      - internal

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles:
      - observability
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles:
      - observability
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${NIXWAY_DATABASE_URL:-postgres://nixway:nixway-dev-secret-change-me@postgres:5432/nixway_core?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    profiles:
      - observability
    restart: unless-stopped
    environment:
      REDIS_ADDR: ${NIXWAY_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  grafana:
    image: grafana/grafana:11.2.2
    profiles:
      - observability
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${NIXWAY_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: https://${NIXWAY_GRAFANA_DOMAIN:-localhost}
      GF_SERVER_DOMAIN: ${NIXWAY_GRAFANA_DOMAIN:-localhost}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - victoria-metrics
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nixway-grafana.rule=Host(`${NIXWAY_GRAFANA_DOMAIN:-grafana.localhost}`)"
      - "traefik.http.routers.nixway-grafana.entrypoints=websecure"
      - "traefik.http.routers.nixway-grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nixway-grafana.priority=20"
      - "traefik.http.services.nixway-grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=${NIXWAY_DOCKER_PUBLIC_NETWORK:-nixway-public}"
    networks:
      - public
      - internal

volumes:
  pgdata:
  redisdata:
  vmdata:
  miniodata:
  traefik_letsencrypt:
  lokidata:
  alloydata:
  grafanadata:

networks:
  public:
    name: ${NIXWAY_DOCKER_PUBLIC_NETWORK:-nixway-public}
  internal:
    name: ${NIXWAY_DOCKER_INTERNAL_NETWORK:-nixway-internal}
