  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    ports:
      - "8428:8428"
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=12"
      - "-downsampling.period=30d:5m"
    volumes:
      - vmdata:/victoria-metrics-data

  vmagent:
    image: victoriametrics/vmagent:latest
    ports:
      - "8429:8429"
    command:
      - "-promscrape.config=/etc/vmagent/prometheus.yml"
      - "-promscrape.configCheckInterval=10s"
      - "-remoteWrite.url=http://victoria-metrics:8428/api/v1/write"
    volumes:
      - ./configs/vmagent.yml:/etc/vmagent/prometheus.yml:ro
    depends_on:
      - victoria-metrics

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: nixway
      MINIO_ROOT_PASSWORD: nixway-dev-secret-change-me
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
#  pgdata:
#  redisdata:
  vmdata:
  miniodata:
