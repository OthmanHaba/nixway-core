apiVersion: 1

# VictoriaMetrics speaks PromQL and the Prometheus HTTP API, so Grafana treats
# it as a Prometheus datasource. This is the same store vmagent already feeds.
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
