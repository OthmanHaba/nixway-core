syntax = "proto3";

package agent.v1;

option go_package = "github.com/othmanhaba/nixway-core/internal/agent/proto/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";

service AgentService {
  rpc Connect(stream AgentMessage) returns (stream ControlMessage);
  rpc Register(RegisterRequest) returns (RegisterResponse);
}

message RegisterRequest {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  bytes csr = 4;
}

message RegisterResponse {
  string agent_id = 1;
  bytes certificate = 2;
  bytes ca_certificate = 3;
}

message AgentMessage {
  oneof payload {
    Heartbeat heartbeat = 1;
    ExecOutput exec_output = 2;
    HealthReport health_report = 3;
    FileChunk file_chunk = 4;
    ResourceReport resource_report = 5;
    ProvisionOutput provision_output = 6;
    SSHKeyInstallResult ssh_key_result = 7;
    WireGuardKeyGenResult wireguard_keygen_result = 8;
    WireGuardApplyResult wireguard_apply_result = 9;
    WireGuardTeardownResult wireguard_teardown_result = 10;
    MeshHealthReport mesh_health_report = 11;
    DNSUpdateResult dns_update_result = 12;
    BuildOutput build_output = 13;
    DeployOutput deploy_output = 14;
    StopContainerResult stop_container_result = 15;
    ImagePullResult image_pull_result = 16;
    ContainerLogsOutput container_logs_output = 17;
    ContainerExecOutput container_exec_output = 18;
    RestartContainerResult restart_container_result = 19;
    ContainerInspectResult container_inspect_result = 20;
    ServerLogsOutput server_logs_output = 21;
    ServerCleanupResult server_cleanup_result = 22;
    TrafficRouteResult traffic_route_result = 23;
    MetricReport metric_report = 24;
    VolumeResult volume_result = 25;
    DatabaseAlterUserResult database_alter_user_result = 26;
    DatabaseQueryResult database_query_result = 27;
    BackupResult backup_result = 28;
    RestoreResult restore_result = 29;
  }
}

message ControlMessage {
  oneof payload {
    ExecCommand exec_command = 1;
    FileTransferRequest file_transfer = 2;
    CertRotation cert_rotation = 3;
    ProvisionCommand provision_command = 4;
    SSHKeyInstallCommand ssh_key_install = 5;
    WireGuardKeyGenCommand wireguard_keygen = 6;
    WireGuardApplyCommand wireguard_apply = 7;
    WireGuardTeardownCommand wireguard_teardown = 8;
    DNSUpdateHostsCommand dns_update_hosts = 9;
    BuildCommand build_command = 10;
    DeployCommand deploy_command = 11;
    StopContainerCommand stop_container = 12;
    ImagePullCommand image_pull = 13;
    ContainerLogsCommand container_logs = 14;
    ContainerExecCommand container_exec = 15;
    ContainerExecInput container_exec_input = 16;
    RestartContainerCommand restart_container = 17;
    ContainerInspectCommand container_inspect = 18;
    ServerLogsCommand server_logs = 19;
    ServerCleanupCommand server_cleanup = 20;
    TrafficRouteCommand traffic_route = 21;
    VolumeCreateCommand volume_create = 22;
    VolumeDeleteCommand volume_delete = 23;
    VolumeMoveCommand volume_move = 24;
    VolumeSnapshotCommand volume_snapshot = 25;
    VolumeResizeCommand volume_resize = 26;
    DatabaseAlterUserCommand database_alter_user = 27;
    DatabaseQueryCommand database_query = 28;
    BackupCommand backup = 29;
    RestoreCommand restore = 30;
  }
}

message Heartbeat {
  string agent_id = 1;
  google.protobuf.Timestamp timestamp = 2;
}

message ExecCommand {
  string command_id = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string working_dir = 5;
}

message ExecOutput {
  string command_id = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  bool finished = 4;
  int32 exit_code = 5;
}

message HealthReport {
  string agent_id = 1;
  double cpu_percent = 2;
  uint64 memory_total = 3;
  uint64 memory_used = 4;
  repeated DiskInfo disks = 5;
}

message MetricReport {
  string agent_id = 1;
  repeated ContainerMetric containers = 2;
}

message ContainerMetric {
  string container_name = 1;
  double cpu_percent = 2;
  double memory_percent = 3;
  uint64 memory_used = 4;
  uint64 memory_limit = 5;
  uint64 network_rx_bytes = 6;
  uint64 network_tx_bytes = 7;
  uint64 block_read_bytes = 8;
  uint64 block_write_bytes = 9;
  int64 restart_count = 10;
  int64 uptime_seconds = 11;
  map<string, string> labels = 12;
}

message DiskInfo {
  string mount_point = 1;
  uint64 total_bytes = 2;
  uint64 used_bytes = 3;
}

message FileChunk {
  string transfer_id = 1;
  bytes data = 2;
  int64 offset = 3;
  bool last = 4;
}

message FileTransferRequest {
  string transfer_id = 1;
  string path = 2;
  enum Direction {
    UPLOAD = 0;
    DOWNLOAD = 1;
  }
  Direction direction = 3;
}

message CertRotation {
  bytes new_certificate = 1;
}

message NetworkInterface {
  string name = 1;
  repeated string ips = 2;
}

message ResourceReport {
  string agent_id = 1;
  string cpu_model = 2;
  int32 cpu_cores = 3;
  uint64 memory_total = 4;
  uint64 memory_available = 5;
  string kernel_version = 6;
  string docker_version = 7;
  repeated DiskInfo disks = 8;
  repeated NetworkInterface network_interfaces = 9;
}

message ProvisionCommand {
  string job_id = 1;
  string component = 2;
  bytes script = 3;
}

message ProvisionOutput {
  string job_id = 1;
  string component = 2;
  bytes output = 3;
  bool finished = 4;
  bool success = 5;
  string error = 6;
}

message SSHKeyInstallCommand {
  string action = 1;
  string public_key = 2;
}

message SSHKeyInstallResult {
  bool success = 1;
  string error = 2;
}

// --- WireGuard Messages ---

// Control plane asks agent to generate a WireGuard keypair.
message WireGuardKeyGenCommand {
  string member_id = 1;
  int32 listen_port = 2;
}

// Agent returns the generated public key. Private key stays on the node.
message WireGuardKeyGenResult {
  string member_id = 1;
  string public_key = 2;
  bool success = 3;
  string error = 4;
}

// Control plane pushes a full WireGuard config to the agent.
message WireGuardApplyCommand {
  string member_id = 1;
  string config = 2;        // full wg0.conf content (PrivateKey placeholder replaced by agent)
  string wireguard_ip = 3;  // e.g. "10.100.0.1"
}

// Agent confirms config was applied.
message WireGuardApplyResult {
  string member_id = 1;
  bool success = 2;
  string error = 3;
}

// Control plane tells agent to tear down its WireGuard interface.
message WireGuardTeardownCommand {
  string member_id = 1;
}

message WireGuardTeardownResult {
  string member_id = 1;
  bool success = 2;
  string error = 3;
}

// --- Mesh Health Messages ---

// Agent periodically reports mesh health to the control plane.
message MeshHealthReport {
  string agent_id = 1;
  string member_id = 2;
  repeated PeerHealthInfo peers = 3;
}

message PeerHealthInfo {
  string peer_member_id = 1;
  string peer_ip = 2;
  bool reachable = 3;
  int32 rtt_ms = 4;
  int32 last_handshake_seconds = 5;  // seconds since last WireGuard handshake
}

// --- DNS Messages ---

// Control plane pushes updated DNS hosts file to the agent.
message DNSUpdateHostsCommand {
  string cluster_slug = 1;
  string hosts_content = 2;    // full hosts file content
  string corefile_content = 3; // full Corefile content
  bool deploy_coredns = 4;     // if true, also deploy/restart CoreDNS container
}

message DNSUpdateResult {
  bool success = 1;
  string error = 2;
}

// --- Build Messages ---

message BuildCommand {
  string build_id = 1;
  string repo_url = 2;
  string commit_sha = 3;
  string auth_token = 4;        // GitHub installation token for private repos
  string branch = 5;
  string root_path = 6;         // subdirectory within repo
  string builder = 7;           // 'auto', 'dockerfile', 'nixpacks', 'buildpacks', 'railpack'
  string dockerfile_path = 8;
  string image_tag = 9;         // target image tag (registry-qualified)
  map<string, string> build_args = 10;
  RegistryAuth registry = 11;   // credentials used to push the built image
}

// RegistryAuth carries the docker-login material for a single registry.
// Server is the hostname (no scheme), e.g. "ghcr.io" or
// "<acct>.dkr.ecr.<region>.amazonaws.com".
message RegistryAuth {
  string server = 1;
  string username = 2;
  string password = 3;
}

message BuildOutput {
  string build_id = 1;
  bytes output = 2;
  string phase = 3;             // 'cloning', 'detecting', 'building'
  bool finished = 4;
  bool success = 5;
  string error = 6;
  string image_id = 7;          // docker image ID on success
}

// --- Deploy Messages ---

message DeployCommand {
  string deploy_id = 1;
  string target_id = 2;         // deployment_target ID
  string image_tag = 3;
  string container_name = 4;
  int32 port = 5;
  map<string, string> env = 6;
  string health_check_path = 7;
  int32 health_check_interval_seconds = 8;
  int32 health_check_timeout_seconds = 9;
  TraefikConfig traefik = 10;
  int32 memory_limit_mb = 11;
  int32 cpu_limit_millicores = 12;
  map<string, string> labels = 13;
  repeated VolumeMount volume_mounts = 14;
  string container_command = 15;     // optional CMD override (template Command field)
  HealthCheckSpec exec_health_check = 16; // optional exec-based health check (databases)
  bool skip_traefik = 17;            // databases are not HTTP-routed
  RegistryAuth registry = 18;        // credentials used to pull the image
}

message VolumeMount {
  string host_path = 1;
  string container_path = 2;
  bool read_only = 3;
}

message HealthCheckSpec {
  string command = 1;         // shell command run inside the container
  int32 interval_seconds = 2;
  int32 timeout_seconds = 3;
  int32 retries = 4;
}

message TraefikConfig {
  string app_slug = 1;
  repeated string domains = 2;
  bool tls = 3;
  int32 port = 4;
}

message TrafficRouteCommand {
  string request_id = 1;
  string app_slug = 2;
  repeated string domains = 3;
  bool tls = 4;
  repeated TrafficBackendGroup groups = 5;
}

message TrafficBackendGroup {
  string name = 1;
  int32 weight = 2;
  repeated string urls = 3;
}

message TrafficRouteResult {
  string request_id = 1;
  string app_slug = 2;
  bool success = 3;
  string error = 4;
}

message DeployOutput {
  string deploy_id = 1;
  string target_id = 2;
  string phase = 3;             // 'starting', 'health_checking', 'healthy', 'failed'
  string container_id = 4;
  bool finished = 5;
  bool success = 6;
  string error = 7;
}

// --- Container Lifecycle ---

message StopContainerCommand {
  string container_name = 1;
  int32 timeout_seconds = 2;
  bool remove_traefik = 3;
  string app_slug = 4;          // for traefik config file removal
}

message StopContainerResult {
  string container_name = 1;
  bool success = 2;
  string error = 3;
}

// --- Container Logs ---

message ContainerLogsCommand {
  string request_id = 1;
  string container_name = 2;
  int32 tail = 3;             // number of lines to tail (0 = 100)
  bool follow = 4;            // stream live logs
}

message ContainerLogsOutput {
  string request_id = 1;
  bytes output = 2;
  bool finished = 3;
  string error = 4;
}

// --- Image Transfer ---

message ImagePullCommand {
  string transfer_id = 1;
  string image_tag = 2;
  string source_server_ip = 3;  // WireGuard IP of server that has the image
}

message ImagePullResult {
  string transfer_id = 1;
  bool success = 2;
  string error = 3;
}

// --- Container Exec (Terminal) ---

message ContainerExecCommand {
  string session_id = 1;
  string container_name = 2;
  string command = 3;        // default "/bin/sh"
  int32 cols = 4;
  int32 rows = 5;
}

message ContainerExecInput {
  string session_id = 1;
  bytes data = 2;            // stdin bytes
  int32 cols = 3;            // resize (0 = no resize)
  int32 rows = 4;
  bool close = 5;            // client closing session
}

message ContainerExecOutput {
  string session_id = 1;
  bytes data = 2;            // stdout/stderr bytes
  bool finished = 3;
  int32 exit_code = 4;
  string error = 5;
}

// --- Container Restart ---

message RestartContainerCommand {
  string container_name = 1;
  int32 timeout_seconds = 2;
}

message RestartContainerResult {
  string container_name = 1;
  bool success = 2;
  string error = 3;
}

// --- Container Inspect ---

message ContainerInspectCommand {
  string request_id = 1;
  string container_name = 2;
}

message ContainerInspectResult {
  string request_id = 1;
  string container_name = 2;
  string status = 3;
  string image = 4;
  string created_at = 5;
  string started_at = 6;
  int64 memory_limit = 7;     // bytes
  int64 memory_usage = 8;     // bytes
  double cpu_percent = 9;
  int64 pid = 10;
  map<string, string> env = 11;
  map<string, string> labels = 12;
  repeated string ports = 13;
  string network_ip = 14;
  int64 restart_count = 15;
  bool success = 16;
  string error = 17;
}

// --- Server Syslog / Journald ---

message ServerLogsCommand {
  string request_id = 1;
  string unit = 2;           // systemd unit (empty = all)
  int32 tail = 3;
  bool follow = 4;
}

message ServerLogsOutput {
  string request_id = 1;
  bytes output = 2;
  bool finished = 3;
  string error = 4;
}

// --- Server Maintenance ---

message ServerCleanupCommand {
  string request_id = 1;
  bool remove_stopped_containers = 2;
  bool remove_unused_images = 3;
  bool remove_unused_networks = 4;
  bool remove_build_cache = 5;
  bool remove_volumes = 6;
  int32 older_than_hours = 7; // applied where Docker supports an until filter
}

message ServerCleanupResult {
  string request_id = 1;
  bool success = 2;
  string output = 3;
  string error = 4;
}

// --- Volume Messages ---

message VolumeCreateCommand {
  string request_id = 1;
  string volume_id = 2;
  string host_path = 3;
  // Declared size of the loopback-backed ext4 volume in GiB. Required on
  // first create; the agent re-uses the existing image's size on retries.
  int32 size_gb = 4;
}

message VolumeDeleteCommand {
  string request_id = 1;
  string volume_id = 2;
  string host_path = 3;
}

message VolumeMoveCommand {
  string request_id = 1;
  string volume_id = 2;
  string source_path = 3;
  string target_wireguard_ip = 4;
  string target_path = 5;
}

message VolumeSnapshotCommand {
  string request_id = 1;
  string volume_id = 2;
  string source_path = 3;
  string snapshot_id = 4;
  string output_path = 5;
}

message VolumeResizeCommand {
  string request_id = 1;
  string volume_id = 2;
  string host_path = 3;
  int32 new_size_gb = 4;
}

message VolumeResult {
  string request_id = 1;
  string volume_id = 2;
  bool success = 3;
  string error = 4;
  int64 size_bytes = 5;
  int64 used_bytes = 6;
  string snapshot_path = 7;
}

// --- Database User Alter (credential rotation) ---

// DatabaseAlterUserCommand asks the agent to change a database user's password
// in the running container. The agent constructs the proper CLI invocation per
// database_type and execs it via `docker exec`. The new_password field is
// transmitted over WireGuard-protected gRPC and MUST NOT be logged.
message DatabaseAlterUserCommand {
  string request_id = 1;
  string database_id = 2;
  string container_name = 3;
  string database_type = 4;       // "postgresql", "mysql", "mongodb", "redis"
  string username = 5;            // user to alter (e.g. "app_user")
  string new_password = 6;        // plaintext (never logged)
}

message DatabaseAlterUserResult {
  string request_id = 1;
  string database_id = 2;
  bool success = 3;
  string error = 4;
}

// --- Database Query Relay (Phase 8.6) ---

// DatabaseQueryCommand asks the agent to execute a query against a managed
// database using the appropriate driver (pgx/mysql/mongo/redis). The agent
// connects locally to the database and returns a single
// DatabaseQueryResult. Passwords cross gRPC over WireGuard; the agent MUST
// NOT log them.
message DatabaseQueryCommand {
  string request_id = 1;
  string database_id = 2;
  string database_type = 3;       // "postgresql" | "mysql" | "mongodb" | "redis"
  string container_name = 4;      // for terminal-style fallback (not used in v1 query relay)
  string host = 5;                // dns_record OR "localhost"
  int32 port = 6;
  string username = 7;            // typically "app_user"
  string password = 8;            // plaintext; never logged
  string dbname = 9;
  string query = 10;              // SQL, Redis command line, or Mongo JSON filter
  bool write_mode = 11;
  int32 timeout_seconds = 12;     // default 30
  int32 max_rows = 13;            // default 1000

  // Operation hint for non-SQL or DB-specific calls. Empty/"select" runs the
  // query verbatim. Recognised values include:
  //   "select", "list_schemas", "list_tables", "get_rows",
  //   "redis_keys", "redis_get", "redis_info", "redis_config", "redis_type", "redis_ttl",
  //   "mongo_list_collections", "mongo_find", "mongo_get_doc"
  string operation = 14;
  map<string, string> params = 15; // operation-specific params
}

// DatabaseQueryResult is returned once per command. For SQL/structured
// results, columns + rows are populated. For Redis INFO, raw text dumps,
// or Mongo JSON arrays, raw_text carries the payload.
message DatabaseQueryResult {
  string request_id = 1;
  bool success = 2;
  string error = 3;
  int64 execution_time_ms = 4;

  repeated ColumnMeta columns = 5;
  repeated QueryRow rows = 6;
  int32 affected_rows = 7;

  string raw_text = 8;
  bool truncated = 9;
}

message ColumnMeta {
  string name = 1;
  string type_name = 2;
}

message QueryRow {
  repeated string values = 1;
  repeated bool nulls = 2;
}

// --- Database Backup + Restore (Phase 8.7) ---

// BackupCommand asks the agent to dump a managed database to a local file
// inside /var/lib/nixway/backups/, then upload the dump to MinIO via the
// supplied presigned PUT URL. Superuser credentials are used so dumps capture
// the entire database (the app_user typically can't). Passwords cross gRPC
// over WireGuard; the agent MUST NOT log them.
message BackupCommand {
  string request_id = 1;
  string backup_id = 2;
  string database_id = 3;
  string container_name = 4;
  string database_type = 5;       // "postgresql" | "mysql" | "mongodb" | "redis"
  string superuser = 6;           // typically "postgres", "root", "admin"
  string superuser_password = 7;  // plaintext; never logged
  string dbname = 8;
  string tool = 9;                // "pg_dump" | "mysqldump" | "mongodump" | "redis-bgsave"
  string output_filename = 10;    // local filename within /var/lib/nixway/backups/
  string upload_url = 11;         // MinIO presigned PUT URL
}

message BackupResult {
  string request_id = 1;
  string backup_id = 2;
  bool success = 3;
  string error = 4;
  int64 size_bytes = 5;
  string storage_path = 6;        // bucket-relative key, e.g. "backups/<db>/<id>.dump"
}

// RestoreCommand asks the agent to download a backup file from MinIO via the
// supplied presigned GET URL and apply it to a target database container.
message RestoreCommand {
  string request_id = 1;
  string backup_id = 2;
  string database_id = 3;
  string container_name = 4;
  string database_type = 5;
  string superuser = 6;
  string superuser_password = 7;  // plaintext; never logged
  string dbname = 8;
  string tool = 9;                // "pg_restore" | "mysql" | "mongorestore" | "redis-load"
  string download_url = 10;       // MinIO presigned GET URL
}

message RestoreResult {
  string request_id = 1;
  string backup_id = 2;
  bool success = 3;
  string error = 4;
}
