syntax = "proto3";

package agent.v1;

option go_package = "github.com/othmanhaba/nixway-core/internal/agent/proto/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";

service AgentService {
  rpc Connect(stream AgentMessage) returns (stream ControlMessage);
  rpc Register(RegisterRequest) returns (RegisterResponse);
}

message RegisterRequest {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  bytes csr = 4;
}

message RegisterResponse {
  string agent_id = 1;
  bytes certificate = 2;
  bytes ca_certificate = 3;
}

message AgentMessage {
  oneof payload {
    Heartbeat heartbeat = 1;
    ExecOutput exec_output = 2;
    HealthReport health_report = 3;
    FileChunk file_chunk = 4;
    ResourceReport resource_report = 5;
    ProvisionOutput provision_output = 6;
    SSHKeyInstallResult ssh_key_result = 7;
    WireGuardKeyGenResult wireguard_keygen_result = 8;
    WireGuardApplyResult wireguard_apply_result = 9;
    WireGuardTeardownResult wireguard_teardown_result = 10;
    MeshHealthReport mesh_health_report = 11;
    DNSUpdateResult dns_update_result = 12;
  }
}

message ControlMessage {
  oneof payload {
    ExecCommand exec_command = 1;
    FileTransferRequest file_transfer = 2;
    CertRotation cert_rotation = 3;
    ProvisionCommand provision_command = 4;
    SSHKeyInstallCommand ssh_key_install = 5;
    WireGuardKeyGenCommand wireguard_keygen = 6;
    WireGuardApplyCommand wireguard_apply = 7;
    WireGuardTeardownCommand wireguard_teardown = 8;
    DNSUpdateHostsCommand dns_update_hosts = 9;
  }
}

message Heartbeat {
  string agent_id = 1;
  google.protobuf.Timestamp timestamp = 2;
}

message ExecCommand {
  string command_id = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string working_dir = 5;
}

message ExecOutput {
  string command_id = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  bool finished = 4;
  int32 exit_code = 5;
}

message HealthReport {
  string agent_id = 1;
  double cpu_percent = 2;
  uint64 memory_total = 3;
  uint64 memory_used = 4;
  repeated DiskInfo disks = 5;
}

message DiskInfo {
  string mount_point = 1;
  uint64 total_bytes = 2;
  uint64 used_bytes = 3;
}

message FileChunk {
  string transfer_id = 1;
  bytes data = 2;
  int64 offset = 3;
  bool last = 4;
}

message FileTransferRequest {
  string transfer_id = 1;
  string path = 2;
  enum Direction {
    UPLOAD = 0;
    DOWNLOAD = 1;
  }
  Direction direction = 3;
}

message CertRotation {
  bytes new_certificate = 1;
}

message NetworkInterface {
  string name = 1;
  repeated string ips = 2;
}

message ResourceReport {
  string agent_id = 1;
  string cpu_model = 2;
  int32 cpu_cores = 3;
  uint64 memory_total = 4;
  uint64 memory_available = 5;
  string kernel_version = 6;
  string docker_version = 7;
  repeated DiskInfo disks = 8;
  repeated NetworkInterface network_interfaces = 9;
}

message ProvisionCommand {
  string job_id = 1;
  string component = 2;
  bytes script = 3;
}

message ProvisionOutput {
  string job_id = 1;
  string component = 2;
  bytes output = 3;
  bool finished = 4;
  bool success = 5;
  string error = 6;
}

message SSHKeyInstallCommand {
  string action = 1;
  string public_key = 2;
}

message SSHKeyInstallResult {
  bool success = 1;
  string error = 2;
}

// --- WireGuard Messages ---

// Control plane asks agent to generate a WireGuard keypair.
message WireGuardKeyGenCommand {
  string member_id = 1;
  int32 listen_port = 2;
}

// Agent returns the generated public key. Private key stays on the node.
message WireGuardKeyGenResult {
  string member_id = 1;
  string public_key = 2;
  bool success = 3;
  string error = 4;
}

// Control plane pushes a full WireGuard config to the agent.
message WireGuardApplyCommand {
  string member_id = 1;
  string config = 2;        // full wg0.conf content (PrivateKey placeholder replaced by agent)
  string wireguard_ip = 3;  // e.g. "10.100.0.1"
}

// Agent confirms config was applied.
message WireGuardApplyResult {
  string member_id = 1;
  bool success = 2;
  string error = 3;
}

// Control plane tells agent to tear down its WireGuard interface.
message WireGuardTeardownCommand {
  string member_id = 1;
}

message WireGuardTeardownResult {
  string member_id = 1;
  bool success = 2;
  string error = 3;
}

// --- Mesh Health Messages ---

// Agent periodically reports mesh health to the control plane.
message MeshHealthReport {
  string agent_id = 1;
  string member_id = 2;
  repeated PeerHealthInfo peers = 3;
}

message PeerHealthInfo {
  string peer_member_id = 1;
  string peer_ip = 2;
  bool reachable = 3;
  int32 rtt_ms = 4;
  int32 last_handshake_seconds = 5;  // seconds since last WireGuard handshake
}

// --- DNS Messages ---

// Control plane pushes updated DNS hosts file to the agent.
message DNSUpdateHostsCommand {
  string cluster_slug = 1;
  string hosts_content = 2;    // full hosts file content
  string corefile_content = 3; // full Corefile content
  bool deploy_coredns = 4;     // if true, also deploy/restart CoreDNS container
}

message DNSUpdateResult {
  bool success = 1;
  string error = 2;
}
